spring:
  config:
    import: optional:vault://secret/inventory-service/dev
  cloud:
    vault:
      enabled: true
      fail-fast: false
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:00000000-0000-0000-0000-000000000000}
      kv:
        enabled: true
        backend: secret
        default-context: inventory-service
        profile-separator: '/'
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/dev/seed.sql
